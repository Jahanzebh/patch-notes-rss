name: Update Patch Notes RSS Feed

on:
  schedule:
    # 08:00 UTC daily — runs before n8n's 11:40 AM UTC schedule, giving n8n a fresh feed
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4

      - name: Run patch notes checker
        run: python check_patches.py
        env:
          # N8N_API_KEY is set as a GitHub repo secret
          # Add it at: Settings → Secrets and variables → Actions → New repository secret
          # Name: N8N_API_KEY  Value: your n8n API key from https://n8n.jayrespawns.com/home/settings/api
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}

      - name: Commit feed.xml and state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add feed.xml last_seen.json
          git diff --cached --quiet || git commit -m "Update patch notes feed $(date -u '+%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
